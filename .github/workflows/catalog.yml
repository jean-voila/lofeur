name: Refresh station catalog
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: station-catalog
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check yt-dlp
      - run: npm ci
      - run: node scripts/refresh-catalog.mjs
      - run: npm test && npm run build && npm run check:static
      - name: Save verified catalog
        run: |
          git config user.name 'lofeur catalog bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/stations.json src/catalog-repairs.json public/station-health.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified public station catalog'
            git push
          fi
